name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Check code formatting (Prettier)
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint code
        run: pnpm run lint

      - name: Build application
        run: pnpm run build

      - name: Run tests (Unit, Integration, E2E)
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
          JWT_SECRET: test-jwt-secret-key-that-is-very-long-and-secure-enough
          GEMINI_API_KEY: dummy-api-key-for-nest-initialization
          GEMINI_MODEL: gemini-3-flash-preview
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_EMBED_MODEL: nomic-embed-text
